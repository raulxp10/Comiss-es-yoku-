<script>
(function(){
  var mouse=document.querySelector('.mouse');

  var path=[
    [0.06,0.18],[0.76,0.15],[0.88,0.45],[0.62,0.76],
    [0.22,0.68],[0.08,0.42],[0.36,0.28],[0.68,0.55]

  var start=performance.now();
  var duration=20000;

  function ease(t){
    return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  }

  function frame(now){

    var pos=t*(path.length);
